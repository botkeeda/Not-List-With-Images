<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes - Digital Locker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 16px; min-height: 100vh;
  }
  h1 { font-size: 22px; text-align: center; margin: 8px 0 16px; }
  .card {
    background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 6px; }
  input[type="text"], input[type="password"], textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: 15px; outline: none;
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, textarea:focus { border-color: #38bdf8; }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 15px;
    font-weight: 600; background: #38bdf8; color: #0f172a; margin-top: 10px; cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .btn-camera { background: #10b981; color: #fff; }
  .btn-gallery { background: #6366f1; color: #fff; margin-top: 8px; }
  .preview { margin-top: 10px; text-align: center; }
  .preview img { max-width: 100%; max-height: 200px; border-radius: 10px; }
  .note-item {
    background: #0f172a; border-radius: 12px; padding: 12px; margin-bottom: 12px;
    border: 1px solid #334155;
  }
  .note-item img { width: 100%; border-radius: 10px; margin-top: 8px; max-height: 260px; object-fit: cover; }
  .note-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: #38bdf8; }
  .note-text { font-size: 14px; color: #cbd5e1; white-space: pre-wrap; word-break: break-word; }
  .note-date { font-size: 11px; color: #64748b; margin-top: 6px; }
  .del-btn {
    background: #ef4444; color: #fff; padding: 8px 12px; font-size: 13px;
    width: auto; margin-top: 10px; border-radius: 8px;
  }
  .empty { text-align: center; color: #64748b; padding: 30px 0; font-size: 14px; }
  #lockScreen {
    position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 30px; z-index: 999;
  }
  #lockScreen h2 { color: #38bdf8; margin-bottom: 16px; }
  #lockScreen input { max-width: 280px; text-align: center; font-size: 18px; letter-spacing: 4px; margin-bottom: 10px;}
  #lockScreen button { max-width: 280px; }
  .err { color: #ef4444; font-size: 13px; margin-top: 8px; height: 16px; text-align: center;}
  .hidden { display: none !important; }
  .settings-box { background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155;}
</style>
</head>
<body>

<!-- Lock Screen -->
<div id="lockScreen">
  <h2>🔒 Enter Password</h2>
  <input type="password" id="passInput" placeholder="••••" inputmode="numeric" maxlength="20">
  <button onclick="unlock()">Unlock</button>
  <div class="err" id="passErr"></div>
  <div style="margin-top:20px; font-size:12px; color:#64748b; text-align:center;">Loading data from GitHub...</div>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <h1>📝 My Digital Notes</h1>

  <!-- GitHub Settings (Token) -->
  <div class="settings-box">
    <label>GitHub Token (Required for sync)</label>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxx" onchange="saveToken()">
  </div>

  <!-- Note Form -->
  <div class="card">
    <label>Title</label>
    <input type="text" id="titleInput" placeholder="Note title...">

    <label style="margin-top:12px;">Note</label>
    <textarea id="noteInput" placeholder="Write your note here..."></textarea>

    <label style="margin-top:12px;">Image (camera or gallery)</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">📷 Open Camera</button>

    <input type="file" id="galleryInput" accept="image/*" style="display:none;">
    <button class="btn-gallery" onclick="document.getElementById('galleryInput').click()">🖼️ Upload from Gallery</button>

    <div class="preview" id="preview"></div>

    <button onclick="saveNote()" style="margin-top: 20px; background: #38bdf8;">💾 Save Note</button>
  </div>

  <!-- Change Password Form -->
  <div class="card" style="background:#1e1e2f;">
    <label style="font-size:15px; color:#ef4444; font-weight:bold;">Change Password</label>
    <input type="password" id="oldPass" placeholder="Old Password" style="margin-top:8px;">
    <input type="password" id="newPass" placeholder="New Password" style="margin-top:8px;">
    <button onclick="changePassword()" style="background:#ef4444; color:white;">🔄 Update Password</button>
  </div>

  <h2 style="font-size:16px; color:#94a3b8; margin:16px 4px 10px;">Saved Notes</h2>
  <div id="notesList"></div>
</div>

<script>
  // ====== GITHUB CONFIG ======
  const GITHUB_USER = "botkeeda";
  const GITHUB_REPO = "Not-List-With-Images";
  const GITHUB_BRANCH = "main"; // agar master hai toh "master" kar dein

  const STORAGE_KEY = "my_digital_notes";
  const PASS_KEY = "my_notes_password";
  const TOKEN_KEY = "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";

  let currentImage = null;
  let globalPassword = "1234"; // Default password

  // ====== GitHub API Functions ======
  
  function getToken() {
    return localStorage.getItem(TOKEN_KEY) || "";
  }

  function saveToken() {
    const token = document.getElementById('tokenInput').value.trim();
    localStorage.setItem(TOKEN_KEY, token);
    alert("Token saved! Now you can sync.");
    // Auto-fetch after token save
    loadDataFromGitHub();
  }

  // Base64 Encode/Decode for GitHub API
  function utf8_to_b64(str) { return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) { return String.fromCharCode('0x' + p1); })); }
  function b64_to_utf8(str) { return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join('')); }

  async function getFileFromGitHub(path) {
    const token = getToken();
    if (!token) return null;
    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        return { content: data.content, sha: data.sha };
      }
      return null;
    } catch (e) { console.error("Fetch error:", e); return null; }
  }

  async function uploadFileToGitHub(path, base64Content, commitMsg) {
    const token = getToken();
    if (!token) { alert("Please enter GitHub Token first!"); return false; }
    
    // Check if file exists to get SHA
    let sha = null;
    const existing = await getFileFromGitHub(path);
    if (existing) sha = existing.sha;

    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: commitMsg,
          content: base64Content,
          sha: sha,
          branch: GITHUB_BRANCH
        })
      });
      return res.ok;
    } catch (e) { console.error("Upload error:", e); return false; }
  }

  // ====== Load Data (Password & Notes) ======
  async function loadDataFromGitHub() {
    const token = getToken();
    if (!token) return;

    // 1. Load Password
    const passFile = await getFileFromGitHub("password.json");
    if (passFile) {
      try {
        const parsed = JSON.parse(b64_to_utf8(passFile.content));
        if (parsed.password) {
          globalPassword = parsed.password;
          localStorage.setItem(PASS_KEY, globalPassword);
        }
      } catch(e) {}
    } else {
      // Create default password.json if not exists
      const defPass = { password: "1234" };
      await uploadFileToGitHub("password.json", utf8_to_b64(JSON.stringify(defPass)), "Create default password.json");
    }

    // 2. Load Notes
    const notesFile = await getFileFromGitHub("data.json");
    if (notesFile) {
      try {
        const parsedNotes = JSON.parse(b64_to_utf8(notesFile.content));
        if (Array.isArray(parsedNotes)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsedNotes));
          renderNotes();
        }
      } catch(e) {}
    }
  }

  // ====== App Logic ======
  function unlock() {
    const val = document.getElementById('passInput').value;
    // Check against local storage password (synced from GitHub) or fallback
    const savedPass = localStorage.getItem(PASS_KEY) || globalPassword;
    
    if (val === savedPass) {
      document.getElementById('lockScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('tokenInput').value = getToken();
      renderNotes();
    } else {
      document.getElementById('passErr').textContent = "Galat password!";
    }
  }
  document.getElementById('passInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') unlock();
  });

  // ---- Image Compress & Upload to GitHub ----
  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        // Compress image using Canvas to save space
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const MAX_SIZE = 800; // Max 800px

        if (width > height) {
          if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
        } else {
          if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        // Get compressed base64 (0.7 quality jpeg)
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
        currentImage = compressedBase64;
        document.getElementById('preview').innerHTML = `<img src="${currentImage}">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  document.getElementById('cameraInput').addEventListener('change', handleImageUpload);
  document.getElementById('galleryInput').addEventListener('change', handleImageUpload);

  // ---- Save Note ----
  async function saveNote() {
    const title = document.getElementById('titleInput').value.trim();
    const text = document.getElementById('noteInput').value.trim();
    if (!title && !text && !currentImage) {
      alert("Kuch to likho ya image lagao!");
      return;
    }

    let imageUrl = "";
    const token = getToken();

    // Upload image to GitHub if token exists
    if (currentImage && token) {
      const base64Data = currentImage.split(',')[1];
      const fileName = `images/img_${Date.now()}.jpg`;
      
      const success = await uploadFileToGitHub(fileName, base64Data, `Upload image ${fileName}`);
      if (success) {
        // Save direct raw URL
        imageUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${fileName}`;
      } else {
        // Fallback to local base64 if upload fails
        imageUrl = currentImage; 
      }
    } else if (currentImage) {
       imageUrl = currentImage; // Save locally if no token
    }

    const notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    notes.unshift({
      id: Date.now(),
      title: title || "Untitled",
      text: text,
      image: imageUrl,
      date: new Date().toLocaleString()
    });
    
    // Save locally
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));

    // Sync to GitHub if token exists
    if (token) {
      const dataJson = JSON.stringify(notes, null, 2);
      await uploadFileToGitHub("data.json", utf8_to_b64(dataJson), "Update notes data");
    }

    // Reset form
    document.getElementById('titleInput').value = "";
    document.getElementById('noteInput').value = "";
    document.getElementById('cameraInput').value = "";
    document.getElementById('galleryInput').value = "";
    document.getElementById('preview').innerHTML = "";
    currentImage = null;

    renderNotes();
  }

  // ---- Render Notes ----
  function renderNotes() {
    const notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const list = document.getElementById('notesList');
    if (notes.length === 0) {
      list.innerHTML = '<div class="empty">Koi note nahi hai abhi. Pehla note banao! ✍️</div>';
      return;
    }
    list.innerHTML = notes.map(n => `
      <div class="note-item">
        <div class="note-title">${escapeHtml(n.title)}</div>
        ${n.text ? `<div class="note-text">${escapeHtml(n.text)}</div>` : ""}
        ${n.image ? `<img src="${n.image}" loading="lazy">` : ""}
        <div class="note-date">${n.date}</div>
        <button class="del-btn" onclick="deleteNote(${n.id})">🗑 Delete</button>
      </div>
    `).join("");
  }

  // ---- Delete Note ----
  async function deleteNote(id) {
    if (!confirm("Ye note delete karna hai?")) return;
    
    let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    notes = notes.filter(n => n.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    renderNotes();

    // Sync delete to GitHub
    const token = getToken();
    if (token) {
      const dataJson = JSON.stringify(notes, null, 2);
      await uploadFileToGitHub("data.json", utf8_to_b64(dataJson), "Delete note");
    }
  }

  // ---- Change Password ----
  async function changePassword() {
    const oldPass = document.getElementById('oldPass').value;
    const newPass = document.getElementById('newPass').value;
    const savedPass = localStorage.getItem(PASS_KEY) || globalPassword;

    if (oldPass !== savedPass) {
      alert("Purana password galat hai!");
      return;
    }
    if (newPass.length < 4) {
      alert("Naya password kam se kam 4 characters ka hona chahiye!");
      return;
    }

    const token = getToken();
    if (!token) {
      alert("Password update karne ke liye GitHub Token zaroori hai!");
      return;
    }

    // Update locally
    globalPassword = newPass;
    localStorage.setItem(PASS_KEY, newPass);

    // Update on GitHub
    const passData = { password: newPass };
    const success = await uploadFileToGitHub("password.json", utf8_to_b64(JSON.stringify(passData)), "Update password");
    
    if (success) {
      alert("✅ Password successfully update ho gaya aur GitHub par save ho gaya!");
      document.getElementById('oldPass').value = "";
      document.getElementById('newPass').value = "";
    } else {
      alert("❌ GitHub par save nahi ho paya. Token check karein.");
    }
  }

  // ---- Utilities ----
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  // Try to auto load on startup if token exists
  window.addEventListener('load', () => {
    if (getToken()) {
      loadDataFromGitHub().then(() => {
        // Default password update if loaded from github
        globalPassword = localStorage.getItem(PASS_KEY) || "1234";
      });
    }
  });
</script>
</body>
</html>
